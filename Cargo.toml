[package]
name = "lsp-server-tokio"
version = "0.1.0"
edition = "2021"
description = "An async-first LSP server infrastructure crate using Tokio"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["io-util", "io-std", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
bytes = "1"
futures = "0.3"
pin-project-lite = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "io-util", "time"] }
