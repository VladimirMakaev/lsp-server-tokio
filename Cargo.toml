[package]
name = "lsp-server-tokio"
version = "0.1.1"
edition = "2021"
description = "An async-first LSP server infrastructure crate using Tokio"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VladimirMakaev/lsp-server-tokio"
documentation = "https://docs.rs/lsp-server-tokio"
homepage = "https://github.com/VladimirMakaev/lsp-server-tokio"
readme = "README.md"
keywords = ["lsp", "language-server", "tokio", "async", "json-rpc"]
categories = ["development-tools", "asynchronous"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["io-util", "io-std", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
bytes = "1"
futures = "0.3"
pin-project-lite = "0.2"

[dev-dependencies]
lsp-types = "0.97"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util", "time", "process", "test-util"] }
